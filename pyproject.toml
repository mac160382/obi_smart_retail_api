[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-retail"
version = "0.1.0"
description = "FastAPI modular monolith with PostgreSQL, JWT HS256 and CSV upload"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "PyJWT>=2.10",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
    "aio-pika>=9.5,<10",
    "openai>=3,<4",
]

[tool.setuptools.package-data]
"app.modules.assistant" = ["business_questions.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
